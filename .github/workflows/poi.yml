# 3か月ごと（1・4・7・10月の11日の朝、日本時間 6:13）に、OpenStreetMap の関東の切り出し（OpenStreetMap フランスの地域の切り出し。
# 毎日更新）から、周辺施設（スーパー・コンビニ・ドラッグストア・病院・公園・保育園など）のタイルを作り直し（scripts/poi/build.py）、
# アプリ（public/data/）に入れる。テストが通れば main に直接入れる（本番は Vercel が main から自動で作り直す）。外部のストレージや鍵は要らない。
# タイルは OpenStreetMap（© OpenStreetMap contributors）から作ったデータベースで、OpenStreetMap と同じ ODbL で公開する。
name: 周辺施設のデータ（OpenStreetMap）

on:
  schedule:
    - cron: "13 21 10 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write

# ほかのデータ更新と同時に main へ書き込まないようにする
concurrency:
  group: data-updates
  cancel-in-progress: false

env:
  TIPPECANOE_VERSION: "2.79.0"

jobs:
  poi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/poi/requirements.txt
      - uses: actions/cache@v4
        id: tippecanoe
        with:
          path: ~/tippecanoe-bin
          key: tippecanoe-${{ env.TIPPECANOE_VERSION }}-${{ runner.os }}
      - name: tippecanoe を作る
        if: steps.tippecanoe.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$TIPPECANOE_VERSION" https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          mkdir -p ~/tippecanoe-bin && cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tile-join ~/tippecanoe-bin/
      - name: OpenStreetMap の関東の切り出しを読む（約0.6GB）
        # 配布元が止まっていることがある（2026年10月に openstreetmap.fr が 502）ので、Geofabrik と openstreetmap.fr の順に試す
        run: |
          for url in https://download.geofabrik.de/asia/japan/kanto-latest.osm.pbf https://download.openstreetmap.fr/extracts/asia/japan/kanto-latest.osm.pbf; do
            if curl -sSfL --retry 2 --retry-delay 30 -o "$RUNNER_TEMP/kanto.osm.pbf" "$url"; then
              echo "読んだ所：$url"
              break
            fi
            rm -f "$RUNNER_TEMP/kanto.osm.pbf"
          done
          ls -la "$RUNNER_TEMP/kanto.osm.pbf"
      - name: タイルを作ってアプリに入れる
        run: |
          pip install -r scripts/poi/requirements.txt
          export PATH="$HOME/tippecanoe-bin:$PATH"
          python3 scripts/poi/build.py --pbf "$RUNNER_TEMP/kanto.osm.pbf" --install
          ls -la public/data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: テストが通れば main に入れる
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain public/data)" ]; then echo "変更なし"; exit 0; fi
          npm ci
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data lib/roadmap/data/poi-source.json
          git commit -m "Update the nearby facility data from OpenStreetMap: $(jq -r .date lib/roadmap/data/poi-source.json) (automatic)"
          git pull --rebase
          git push
