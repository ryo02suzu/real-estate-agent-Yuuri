# GitHub の Issue・PR のコメントに「@claude」と書くと、Claude（Claude Code）がこのリポジトリで作業して、同じ所に返事をする。
# ChatGPT で相談した内容は、ChatGPT（自分で作る GPT のアクション）が Issue として送る。手順は docs/chatgpt-to-claude.md。
#  - 動かせるのは、このリポジトリに書き込める人だけ。ほかの人やボットのコメントでは動かない（claude-code-action の決まり）
#  - Issue・コメントで動く仕組みは main にあるこのファイルを使うので、main に入ってから効く
#  - 認証は Claude のサブスクリプションのトークン（Secrets の CLAUDE_CODE_OAUTH_TOKEN）。API キーにするなら下の行を
#    anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} に替える（使った分だけ料金がかかる）
#  - Claude が守るルールは CLAUDE.md
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # 長く動き続けないように（1 回の依頼で 60 分まで）
    timeout-minutes: 60
    # 同じ Issue・PR の依頼は 1 つずつ（前の作業が終わってから次へ）
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Claude が lint・型・テスト・ビルドで確かめられるように、部品を入れておく
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 管理設定だけが exact / deniedModels を強制できる。使い捨ての runner に配置する。
      # Claude が別ブランチへ移動しても検査できるよう、監査コードを先に退避する。
      - name: モデル制限を準備
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          sudo install -d -m 0755 /etc/claude-code
          sudo install -m 0644 .github/claude-managed-settings.json /etc/claude-code/managed-settings.json
          install -m 0500 .github/scripts/verify_claude_models.py "$RUNNER_TEMP/verify_claude_models.py"
      - uses: anthropics/claude-code-action@v1
        id: claude_run
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 開発の指定モデルはOpus 5.5/Fable 5.1のみ。Sonnet/Haikuへ切り替えない。
          # メインはOpus 5.5、許可する唯一の代替はFable 5.1。
          # subagentとeffortにも同じ制限を適用する。利用できなければ他モデルで続行しない。
          # Ultracodeはモデルのeffortではなく動的ワークフロー。maxは維持して併用する。
          # 初期検証はsmall（5未満を目安。厳密な上限ではない）で並列過多を防ぐ。
          # 非対話GitHub ActionsではWorkflowの実行許可が必要。
          settings: |
            {
              "model": "claude-opus-5-5",
              "availableModels": ["claude-opus-5-5", "claude-fable-5-1"],
              "enforceAvailableModels": true,
              "fallbackModel": ["claude-fable-5-1"],
              "switchModelsOnFlag": false,
              "ultracode": true,
              "enableWorkflows": true,
              "workflowSizeGuideline": "small",
              "permissions": {
                "allow": ["Workflow"]
              },
              "env": {
                "CLAUDE_CODE_SUBAGENT_MODEL": "claude-opus-5-5",
                "CLAUDE_CODE_EFFORT_LEVEL": "max"
              }
            }
          claude_args: |
            --model claude-opus-5-5
            --fallback-model claude-fable-5-1
            --effort max
            --allowedTools "Bash(npm run lint:*),Bash(npm run typecheck:*),Bash(npm test:*),Bash(npm run build:*),Bash(npx vitest run:*)"
      # 実使用に禁止モデルが混じったとき、成功した Claude 応答でもジョブを失敗させる。
      # 会話本文・住所・トークンをログや artifact に出さない。
      - name: 実際に使用したモデルを検査
        if: ${{ always() && steps.claude_run.outcome != 'skipped' }}
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude_run.outputs.execution_file }}
        run: python3 "$RUNNER_TEMP/verify_claude_models.py" "$CLAUDE_EXECUTION_FILE"
