# GitHub の Issue・PR のコメントに「@claude」と書くと、Claude（Claude Code）がこのリポジトリで作業して、同じ所に返事をする。
# ChatGPT で相談した内容は、ChatGPT（自分で作る GPT のアクション）が Issue として送る。手順は docs/chatgpt-to-claude.md。
#  - 動かせるのは、このリポジトリに書き込める人だけ。ほかの人やボットのコメントでは動かない（claude-code-action の決まり）
#  - Issue・コメントで動く仕組みは main にあるこのファイルを使うので、main に入ってから効く
#  - 認証は Claude のサブスクリプションのトークン（Secrets の CLAUDE_CODE_OAUTH_TOKEN）。API キーにするなら下の行を
#    anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} に替える（使った分だけ料金がかかる）
#  - Claude が守るルールは CLAUDE.md
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # 長く動き続けないように（1 回の依頼で 60 分まで）
    timeout-minutes: 60
    # 同じ Issue・PR の依頼は 1 つずつ（前の作業が終わってから次へ）
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Claude が lint・型・テスト・ビルドで確かめられるように、部品を入れておく
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude Codeの最大effortを各GitHub Actionsセッションで指定する
          claude_args: |
            --effort max
            --allowedTools "Bash(npm run lint:*),Bash(npm run typecheck:*),Bash(npm test:*),Bash(npm run build:*),Bash(npx vitest run:*)"
