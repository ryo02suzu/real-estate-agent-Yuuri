# 毎月6日の朝（日本時間 6:25）に、関東1都6県とそのまわりの駅のデータ（最寄り駅・徒歩の目安に使う）を作り直し、アプリ（public/data/）に入れる。
# 駅と路線は国土数値情報の鉄道データ（N02。毎年春ごろ新しい年が出る）、駅の出入口の位置は OpenStreetMap の関東の切り出し（毎日更新）。
# 出入口は毎月変わりうるので、新しい年が出ていなくても毎月作り直して入れる（データの時点 doorsDate も毎月新しくなる）。
# テストが通れば main に直接入れる（本番は Vercel が main から自動で作り直す）。外部のストレージや鍵は要らない。
# 出入口の点を含むデータは OpenStreetMap（© OpenStreetMap contributors）から作ったデータベースなので、OpenStreetMap と同じ ODbL で公開する。
name: 駅のデータ（最新版）

on:
  schedule:
    - cron: "25 21 5 * *"
  workflow_dispatch:

permissions:
  contents: write

# ほかのデータ更新と同時に main へ書き込まないようにする
concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  stations:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 新しい年のデータが出たか（出ていなくても、出入口のために作り直す）
        run: python3 scripts/stations/build.py --check
      - name: OpenStreetMap の対応している地方の切り出しを読む（関東・中部。各0.5〜0.6GB）
        # 配布元が止まっていることがある（2026年10月に openstreetmap.fr が 502）ので、Geofabrik と openstreetmap.fr の順に試す
        run: |
          for region in $(jq -r 'keys[]' lib/roadmap/data/regions.json); do
            for url in "https://download.geofabrik.de/asia/japan/$region-latest.osm.pbf" "https://download.openstreetmap.fr/extracts/asia/japan/$region-latest.osm.pbf"; do
              if curl -sSfL --retry 2 --retry-delay 30 -o "$RUNNER_TEMP/$region.osm.pbf" "$url"; then
                echo "読んだ所：$url"
                break
              fi
              rm -f "$RUNNER_TEMP/$region.osm.pbf"
            done
            ls -la "$RUNNER_TEMP/$region.osm.pbf"
          done
      - name: 駅のデータを作ってアプリに入れる
        run: |
          pip install -r scripts/poi/requirements.txt
          python3 scripts/stations/build.py --install --osm "$RUNNER_TEMP"/*.osm.pbf
          ls -la public/data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: テストが通れば main に入れる
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain public/data)" ]; then echo "変更なし"; exit 0; fi
          npm ci
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data lib/roadmap/data/station-source.json
          git commit -m "Update the station data: $(jq -r .year lib/roadmap/data/station-source.json), entrances $(jq -r .doorsDate lib/roadmap/data/station-source.json) (automatic)"
          git pull --rebase
          git push
