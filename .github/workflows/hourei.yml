# 毎月8日の朝（日本時間 6:35）に、国土数値情報の砂防指定地・地すべり防止区域・急傾斜地崩壊危険区域・災害危険区域に
# 新しい年度のデータが出たかを見て（都県ごと）、出ていれば関東1都6県の区域のタイルを作り直し、アプリ（public/data/）に入れる。
# テストが通れば main に直接入れる（本番は Vercel が main から自動で作り直す）。外部のストレージや鍵は要らない。
name: 砂防指定地・急傾斜地などの区域の地図データ（最新版）

on:
  schedule:
    - cron: "35 21 7 * *"
  workflow_dispatch:
    inputs:
      force:
        description: 新しいデータが無くても作り直す
        type: boolean
        default: false

permissions:
  contents: write

# ほかのデータ更新と同時に main へ書き込まないようにする
concurrency:
  group: data-updates
  cancel-in-progress: false

env:
  TIPPECANOE_VERSION: "2.79.0"

jobs:
  hourei:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 新しいデータが出たか
        id: c
        run: |
          python3 scripts/hourei/build.py --check
          if [ "${{ inputs.force }}" = "true" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache@v4
        if: steps.c.outputs.changed == 'true'
        id: tippecanoe
        with:
          path: ~/tippecanoe-bin
          key: tippecanoe-${{ env.TIPPECANOE_VERSION }}-${{ runner.os }}
      - name: tippecanoe を作る
        if: steps.c.outputs.changed == 'true' && steps.tippecanoe.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$TIPPECANOE_VERSION" https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          mkdir -p ~/tippecanoe-bin && cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tile-join ~/tippecanoe-bin/
      - name: タイルを作ってアプリに入れる
        if: steps.c.outputs.changed == 'true'
        run: |
          export PATH="$HOME/tippecanoe-bin:$PATH"
          python3 scripts/hourei/build.py --install --work "$RUNNER_TEMP/hourei"
          ls -la public/data
      - uses: actions/setup-node@v4
        if: steps.c.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
      - name: テストが通れば main に入れる
        if: steps.c.outputs.changed == 'true'
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain public/data)" ]; then echo "変更なし"; exit 0; fi
          npm ci
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data lib/roadmap/data/hourei-source.json
          git commit -m "Update the sabo, landslide, steep slope and disaster risk area data: $(jq -c .years lib/roadmap/data/hourei-source.json) (automatic)"
          git pull --rebase
          git push
