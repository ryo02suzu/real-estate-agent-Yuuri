# プッシュごとに型チェック・lint・テスト・ビルドを回す
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # ビルドは next/font/google が Google Fonts から書体のファイル（約140）を落とし、1つでも落とせないと失敗する。
      # 通信が一時的に失敗したときのために、1回だけやり直す
      - run: npm run build || (echo "ビルドをやり直します（書体のダウンロードの失敗など）" && npm run build)
