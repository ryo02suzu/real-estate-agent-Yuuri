# 物件の地点で使う国のデータ（液状化の発生傾向・大規模盛土造成地・災害履歴・駅別乗降客数・地価公示の鑑定評価書・将来推計人口・
# 医療機関と幼稚園）を、国土交通省「不動産情報ライブラリ」の API と国土数値情報から作り（scripts/reinfolib/build.py）、
# Cloudflare R2 に置く。置き終えたら lib/roadmap/data/reinfolib-source.json（データごとの置き場所・時点・件数）を書き換え、
# テストが通れば、このブランチに入れる。データはあまり変わらないので、3か月ごとに作り直す。
#
# 必要な設定（無ければ何もしないで終わる）:
#   Secrets:   REINFOLIB_API_KEY（不動産情報ライブラリの API 利用申請で届くキー）
#              R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY（地番の地図データと同じ）
#   Variables: R2_PUBLIC_URL（バケットの公開 URL）、R2_BUCKET（省略時 michilu-chiban）
name: 国の地点データ（不動産情報ライブラリ）

on:
  workflow_dispatch:
    inputs:
      only:
        description: 作るデータ（カンマ区切り。空なら全部：liq,zousei,rireki,ridership,appraisal,pop,fac）
        type: string
        default: ""
  schedule:
    - cron: "40 19 12 1,4,7,10 *"
  # 本番（main）に入るまでは、作業用ブランチでこの処理か作り方を変えたときにも動かす（GitHub は main に無い処理を手で起動できないため）
  push:
    branches: [claude/system-feedback-eggn72]
    paths: [".github/workflows/reinfolib.yml", "scripts/reinfolib/**"]

permissions:
  contents: write

concurrency:
  group: reinfolib
  cancel-in-progress: false

env:
  R2_BUCKET: ${{ vars.R2_BUCKET || 'michilu-chiban' }}
  R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  TIPPECANOE_VERSION: "2.79.0"

jobs:
  reinfolib:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      ONLY: ${{ inputs.only }}
    steps:
      - name: 設定があるか
        id: c
        run: |
          echo "stamp=$(TZ=Asia/Tokyo date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          if [ -z "$REINFOLIB_API_KEY" ]; then
            echo "::warning::REINFOLIB_API_KEY（不動産情報ライブラリの API キー）が Secrets に無いので何もしません"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_PUBLIC_URL" ]; then
            echo "::warning::R2 の設定（Secrets: R2_ACCOUNT_ID・R2_ACCESS_KEY_ID・R2_SECRET_ACCESS_KEY、Variables: R2_PUBLIC_URL）が無いので何もしません"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.c.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.c.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: 変換のテスト
        if: steps.c.outputs.ready == 'true'
        run: python3 scripts/reinfolib/build.py --self-test
      - uses: actions/cache@v4
        if: steps.c.outputs.ready == 'true'
        id: tippecanoe
        with:
          path: ~/tippecanoe-bin
          key: tippecanoe-${{ env.TIPPECANOE_VERSION }}-${{ runner.os }}
      - name: tippecanoe を作る
        if: steps.c.outputs.ready == 'true' && steps.tippecanoe.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$TIPPECANOE_VERSION" https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          mkdir -p ~/tippecanoe-bin && cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tile-join ~/tippecanoe-bin/
      - name: API と国土数値情報からデータを作る
        if: steps.c.outputs.ready == 'true'
        run: |
          export PATH="$HOME/tippecanoe-bin:$PATH"
          python3 scripts/reinfolib/build.py --out work/reinfolib --work work/tmp ${ONLY:+--only "$ONLY"}
          du -sh work/reinfolib/* | sort -h | tail -20
      - name: R2 に置く
        if: steps.c.outputs.ready == 'true'
        env:
          STAMP: ${{ steps.c.outputs.stamp }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          dest="s3://$R2_BUCKET/reinfolib/$STAMP/"
          # JSON は gzip で書いてあるので、そのまま Content-Encoding: gzip で置く（ブラウザが戻す）
          aws s3 cp work/reinfolib "$dest" --recursive --exclude "*" --include "*.json" --exclude "meta.json" --endpoint-url "$R2_ENDPOINT" --only-show-errors \
            --content-encoding gzip --content-type "application/json; charset=utf-8" --cache-control "public, max-age=604800"
          aws s3 cp work/reinfolib "$dest" --recursive --exclude "*" --include "*.pmtiles" --endpoint-url "$R2_ENDPOINT" --only-show-errors \
            --content-type "application/octet-stream" --cache-control "public, max-age=604800"
          # ブラウザから読めるようにする（地番・建物のタイルと同じ設定）
          cat > cors.json <<'JSON'
          {"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","HEAD"],"AllowedHeaders":["Range","If-Match","If-None-Match"],"ExposeHeaders":["Content-Range","Content-Length","ETag","Accept-Ranges"],"MaxAgeSeconds":86400}]}
          JSON
          aws s3api put-bucket-cors --bucket "$R2_BUCKET" --cors-configuration file://cors.json --endpoint-url "$R2_ENDPOINT"
      - name: 公開 URL で読めるか確かめる
        if: steps.c.outputs.ready == 'true'
        env:
          STAMP: ${{ steps.c.outputs.stamp }}
        run: |
          base="${R2_PUBLIC_URL%/}/reinfolib/$STAMP"
          # 作ったデータごとに1つずつ
          samples=$(cd work/reinfolib && python3 -c "import glob; print(' '.join(sorted(glob.glob(p))[0] for p in ('liq/*.json', 'pop/*.json', 'ridership.json', 'appraisal/*/*.json') if glob.glob(p)))")
          for f in $samples; do
            curl -sS --compressed -H "Origin: https://michilu.vercel.app" -D headers.txt -o got.json "$base/$f"
            grep -qi "^HTTP/.* 200" headers.txt || { cat headers.txt; echo "::error::読めません: $base/$f"; exit 1; }
            grep -qi "^content-encoding: gzip" headers.txt || { cat headers.txt; echo "::error::gzip になっていません: $base/$f"; exit 1; }
            grep -qi "^access-control-allow-origin:" headers.txt || { echo "::error::CORS のヘッダがありません"; exit 1; }
            python3 -c "import json; json.load(open('got.json'))" || { echo "::error::JSON が読めません: $base/$f"; exit 1; }
            echo "ok $f"
          done
          for f in $(cd work/reinfolib && ls *.pmtiles 2>/dev/null); do
            curl -sS -H "Origin: https://michilu.vercel.app" -H "Range: bytes=0-126" -D headers.txt -o head.bin "$base/$f"
            grep -qi "^HTTP/.* 206" headers.txt || { cat headers.txt; echo "::error::範囲指定で読めません: $base/$f"; exit 1; }
            head -c 7 head.bin | grep -q "PMTiles" || { echo "::error::PMTiles ではありません: $base/$f"; exit 1; }
            echo "ok $f"
          done
          echo "BASE=$base" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: steps.c.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: アプリの置き場所を書き換え、テストが通ればこのブランチに入れる
        if: steps.c.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          meta = json.load(open("work/reinfolib/meta.json", encoding="utf-8"))
          path = "lib/roadmap/data/reinfolib-source.json"
          src = json.load(open(path, encoding="utf-8")) if os.path.exists(path) else {}
          # 作ったデータだけ置き場所と時点を書き換える（ほかのデータは前のまま）
          for name, info in meta.items():
              if name == "stamp":
                  continue
              info = {k: v for k, v in info.items() if k != "meshes"}
              src[name] = {"url": os.environ["BASE"], "asOf": meta["stamp"], **info}
          with open(path, "w", encoding="utf-8") as f:
              json.dump(dict(sorted(src.items())), f, ensure_ascii=False, indent=1)
              f.write("\n")
          print(json.dumps({k: {kk: vv for kk, vv in v.items() if kk in ("url", "asOf", "count", "year", "counts")} for k, v in src.items()}, ensure_ascii=False, indent=1))
          PY
          if git diff --quiet; then echo "変更なし"; exit 0; fi
          npm ci
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/roadmap/data/reinfolib-source.json
          git commit -m "Use the ${{ steps.c.outputs.stamp }} national point data from REINFOLIB and KSJ on R2 (automatic)"
          git pull --rebase
          git push
      - name: 作れなかったデータがあれば知らせる
        if: steps.c.outputs.ready == 'true'
        run: |
          if [ -f work/reinfolib/failed.txt ]; then
            echo "::error::作れなかったデータ（前のデータのまま）: $(cat work/reinfolib/failed.txt)"
            exit 1
          fi
