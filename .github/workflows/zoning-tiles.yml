# 毎月2日の朝（日本時間 6:40）に、国土交通省「都市計画決定GISデータ」（G空間情報センターの全国データ）が更新されたかを見て、
# 更新されていれば関東1都6県の用途地域・建ぺい率・容積率・防火地域などのタイルを作り直し、アプリ（public/data/）に入れる。
# テストが通れば main に直接入れる（本番は Vercel が main から自動で作り直す）。外部のストレージや鍵は要らない。
name: 都市計画の地図データ（最新版）

on:
  schedule:
    - cron: "40 21 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: 更新が無くても作り直す
        type: boolean
        default: false

permissions:
  contents: write

# ほかのデータ更新と同時に main へ書き込まないようにする
concurrency:
  group: data-updates
  cancel-in-progress: false

env:
  TIPPECANOE_VERSION: "2.79.0"

jobs:
  zoning:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: 国のデータが更新されたか
        id: c
        run: |
          python3 scripts/zoning-tiles/build.py --check
          if [ "${{ inputs.force }}" = "true" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache@v4
        if: steps.c.outputs.changed == 'true'
        id: tippecanoe
        with:
          path: ~/tippecanoe-bin
          key: tippecanoe-${{ env.TIPPECANOE_VERSION }}-${{ runner.os }}
      - name: tippecanoe を作る
        if: steps.c.outputs.changed == 'true' && steps.tippecanoe.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$TIPPECANOE_VERSION" https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          mkdir -p ~/tippecanoe-bin && cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tile-join ~/tippecanoe-bin/
      - name: タイルを作ってアプリに入れる
        if: steps.c.outputs.changed == 'true'
        run: |
          export PATH="$HOME/tippecanoe-bin:$PATH"
          python3 scripts/zoning-tiles/build.py --install --work "$RUNNER_TEMP/zoning"
          ls -la public/data
      - uses: actions/setup-node@v4
        if: steps.c.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
      - name: テストが通れば main に入れる
        if: steps.c.outputs.changed == 'true'
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain public/data)" ]; then echo "変更なし"; exit 0; fi
          npm ci
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data lib/roadmap/data/zoning-source.json lib/roadmap/data/zoning-status.json
          git commit -m "Update the city planning (zoning) data: $(jq -r .edition lib/roadmap/data/zoning-source.json) (automatic)"
          git pull --rebase
          git push
