# 一時的：GitHub Actions から埼玉県・千葉県のオープンデータサイトに届くか（sanko-tiles.yml が 403 で失敗した原因）を確かめる。確かめたら消す
name: probe open data portals

on:
  push:
    branches: [claude/system-feedback-eggn72]
    paths: [.github/workflows/portal-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: どこから読んでいるか
        run: curl -sS --max-time 20 https://ipinfo.io/json || true
      - name: curl（ページ・リソース・ダウンロード）
        run: |
          UA="michilu-sanko (+https://github.com/ryo02suzu/real-estate-agent-Yuuri)"
          for u in \
            https://opendata.pref.saitama.lg.jp/ \
            https://opendata.pref.saitama.lg.jp/datasets/3520 \
            https://opendata.pref.saitama.lg.jp/resources/9080 \
            https://opendata.pref.saitama.lg.jp/resource_download/9080 \
            https://opendata.pref.chiba.lg.jp/datasets/3321 \
            https://opendata.pref.chiba.lg.jp/resource_download/54018 \
            https://data.bodik.jp/api/3/action/package_show?id=102016_tisekizu ; do
            code=$(curl -sS -A "$UA" -r 0-15 -o body.bin -D head.txt -w '%{http_code}' --max-time 60 "$u" || echo ERR)
            echo "== $code $u"
            grep -iE '^(server|via|x-cache|x-amz|cf-ray|content-type|content-length|content-range):' head.txt || true
            if [ "$code" != "200" ] && [ "$code" != "206" ]; then head -c 1200 body.bin || true; echo; fi
          done
      - name: python の urllib（build.py と同じ読み方）
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          UA = "michilu-sanko (+https://github.com/ryo02suzu/real-estate-agent-Yuuri)"
          for u in ["https://opendata.pref.saitama.lg.jp/datasets/3520", "https://opendata.pref.saitama.lg.jp/resource_download/9080", "https://opendata.pref.chiba.lg.jp/datasets/3321"]:
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA, "Range": "bytes=0-15"}), timeout=60) as r:
                      print(r.status, u, r.headers.get("Server"))
              except urllib.error.HTTPError as e:
                  print(e.code, u, e.headers.get("Server"), e.read()[:600])
              except Exception as e:
                  print("ERR", u, repr(e))
          PY
