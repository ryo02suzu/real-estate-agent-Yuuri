# One-shot installer for the 5 selected upstream Agent Skills families.
# Runs only on its dedicated branch and removes itself from the final change.
name: Install MICHILU upstream Agent Skills

on:
  push:
    branches:
      - chore/michilu-vendor-agent-skills-20261031
    paths:
      - .github/workflows/install-michilu-vendor-skills.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DISABLE_TELEMETRY: "1"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install official and curated upstream skills into Claude Code
        shell: bash
        run: |
          set -euo pipefail
          npx --yes skills@1.7.4 add vercel-labs/agent-skills --skill vercel-react-best-practices --skill web-design-guidelines --skill vercel-react-view-transitions -a claude-code --copy -y
          npx --yes skills@1.7.4 add google/skills --skill google-cloud-solution-architecture --skill google-cloud-waf-security --skill google-cloud-waf-performance-optimization --skill google-cloud-waf-cost-optimization -a claude-code --copy -y
          npx --yes skills@1.7.4 add google-labs-code/stitch-skills --skill '*' -a claude-code --copy -y
          npx --yes skills@1.7.4 add addyosmani/agent-skills --skill browser-testing-with-devtools --skill source-driven-development -a claude-code --copy -y
          npx --yes skills@1.7.4 add obra/superpowers --skill brainstorming --skill writing-plans --skill executing-plans --skill systematic-debugging --skill test-driven-development --skill verification-before-completion --skill requesting-code-review --skill finishing-a-development-branch -a claude-code --copy -y
      - name: Validate installation structure and clean installer
        shell: bash
        run: |
          set -euo pipefail
          for name in vercel-react-best-practices web-design-guidelines vercel-react-view-transitions google-cloud-solution-architecture google-cloud-waf-security google-cloud-waf-performance-optimization google-cloud-waf-cost-optimization browser-testing-with-devtools source-driven-development brainstorming writing-plans executing-plans systematic-debugging test-driven-development verification-before-completion requesting-code-review finishing-a-development-branch; do
            test -s ".claude/skills/$name/SKILL.md" || { echo "Missing installed skill: $name"; exit 1; }
          done
          test "$(find .claude/skills -name SKILL.md | wc -l)" -gt 20
          git rm -f .github/workflows/install-michilu-vendor-skills.yml
      - name: Commit actual skill files to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/skills
          if test -d .agents/skills; then git add .agents/skills; fi
          if test -f skills-lock.json; then git add skills-lock.json; fi
          if test -f .skills-lock.json; then git add .skills-lock.json; fi
          git diff --cached --stat | tail -70
          git diff --cached --quiet && { echo "No skill changes found"; exit 1; }
          git commit -m "chore: vendor upstream Agent Skills for MICHILU"
          git push origin HEAD:chore/michilu-vendor-agent-skills-20261031
